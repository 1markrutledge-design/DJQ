<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Market Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <header>
            <div class="logo">
                <h1>KALSHI<span>SENSE</span></h1>
                <p>Hypothetical Intelligence Dashboard</p>
            </div>
            <div class="status-bar">
                <div class="status-item">
                    <span class="label">Status</span>
                    <span class="value pulse">LIVE MONITORING</span>
                </div>
                <div class="status-item">
                    <span class="label">Last Update</span>
                    <span id="last-update" class="value">--:--:--</span>
                </div>
            </div>
        </header>

        <div id="market-grid" class="market-grid">
            <!-- Market Cards injected here -->
            <div class="loading">Initializing Neural Feed...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
