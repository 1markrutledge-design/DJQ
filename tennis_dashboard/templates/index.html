<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Bot Dashboard</title>
    <style>
        :root {
            --bg-primary: #0f1115;
            --bg-secondary: #1a1d24;
            --bg-card: #222630;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-blue: #3b82f6;
            --profit: #3fb950;
            --loss: #f85149;
            --border: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: var(--accent-blue);
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .profit {
            color: var(--profit);
        }

        .loss {
            color: var(--loss);
        }

        .invest {
            color: #f1e05a;
        }

        /* Yellow for active investments */

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .action-buy {
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .action-sell {
            background-color: rgba(248, 81, 73, 0.2);
            color: var(--loss);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎾 Tennis Trading Bot Dashboard</h1>

        <div class="grid">
            <div class="card">
                <div class="stat-label">Available Portfolio Balance</div>
                <div class="stat-value" id="balance">$0.00</div>
            </div>
            <div class="card">
                <div class="stat-label">Realized P&L</div>
                <div class="stat-value" id="total-pnl">$0.00</div>
            </div>
            <div class="card">
                <div class="stat-label">Active Investment</div>
                <div class="stat-value invest" id="active-invest">$0.00</div>
            </div>
            <div class="card">
                <div class="stat-label">Win Rate</div>
                <div class="stat-value" id="win-rate">0.0%</div>
                <div style="color: var(--text-secondary); font-size: 0.8rem; margin-top: 5px;">Across <span
                        id="settled-bets">0</span> settled matches</div>
            </div>
        </div>

        <div class="card" style="padding: 0;">
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Player Name</th>
                        <th>Action</th>
                        <th>Execution Price</th>
                        <th>Trade Value</th>
                    </tr>
                </thead>
                <tbody id="recent-trades">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-secondary);">Loading trades...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const formatCurrency = (val) => {
            const num = parseFloat(val);
            return (num >= 0 ? '$' : '-$') + Math.abs(num).toFixed(2);
        };

        const loadData = async () => {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                // Update Overview Stats
                document.getElementById('balance').textContent = formatCurrency(data.balance);

                const totalEl = document.getElementById('total-pnl');
                totalEl.textContent = formatCurrency(data.total_realized_pnl);
                totalEl.className = 'stat-value ' + (data.total_realized_pnl >= 0 ? 'profit' : 'loss');

                const activeEl = document.getElementById('active-invest');
                activeEl.textContent = formatCurrency(data.active_investment);

                document.getElementById('win-rate').textContent = data.win_rate + '%';
                document.getElementById('settled-bets').textContent = data.settled_bets;

                // Render Trades
                const tbody = document.getElementById('recent-trades');
                if (data.recent_trades.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No trades found for the new strategy yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.recent_trades.map(t => {
                    const dateObj = new Date(t.date);
                    return `
                        <tr>
                            <td style="color: var(--text-secondary);">${dateObj.toLocaleDateString()} ${dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
                            <td style="font-weight: 500;">${t.player}</td>
                            <td><span class="action-${t.action.toLowerCase()}">${t.action.toUpperCase()}</span></td>
                            <td>${t.price}¢</td>
                            <td style="color: var(--text-secondary);">$${t.trade_value.toFixed(2)}</td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error("Failed to fetch dashboard data:", err);
            }
        };

        // Load immediately, then every 60 seconds
        loadData();
        setInterval(loadData, 60000);
    </script>
</body>

</html>
